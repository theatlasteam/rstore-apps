name: Validate catalog
on: [push, pull_request]
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/github-direct.test.cjs
