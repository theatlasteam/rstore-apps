name: Validate catalog
on: [push, pull_request]
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/github-direct.test.cjs
      - run: npm ci --prefix projects/refresh-weather/tests/tools --no-audit --no-fund
      - run: node projects/refresh-weather/tests/weather.test.cjs
      - run: npm install --prefix service --ignore-scripts --no-audit --no-fund
      - run: node tests/weather-proxy.test.mjs
