name: Import upstream Telekram
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-telekram.yml'
      - 'scripts/import-telekram.py'
      - 'imports/telekram.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-telekram
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect and mirror the original KaiOS 2.5 package
        run: python3 scripts/import-telekram.py
      - name: Validate the complete catalog
        run: python3 scripts/validate.py
      - name: Commit verified application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json apps/telekram
          if ! git diff --cached --quiet; then
            git commit -m 'Add Telekram 1.3.0 for KaiOS 2.5 with original package and source'
            git push origin HEAD:main
          fi
