<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Refresh AI</title>
  <link rel="stylesheet" href="app://theme.gaiamobile.org/shared/elements/gaia-theme/gaia-theme.css">
  <link rel="stylesheet" href="refresh-ui.css">
  <style>
    .msg{border-radius:10px;padding:8px 9px;margin:0 0 6px;font-size:13px;line-height:1.4;white-space:pre-wrap;overflow-wrap:break-word;border:1px solid var(--kr-border,#222d3c)}
    .msg.user{background:var(--kr-accent,#8ab4ff);color:var(--kr-focus,#17202c);border-color:var(--kr-accent,#8ab4ff)}
    .msg.assistant{background:var(--kr-surface,#121821);color:var(--kr-text,#e8eef8)}
    .msg .role{font-size:10px;font-weight:700;opacity:.75;margin-bottom:2px;text-transform:uppercase}
  </style>
  <script defer src="refresh-ui.js"></script>
  <script defer src="app.js"></script>
  <script defer src="kaios-refresh-v2/runtime.js"></script>
</head>
<body class="theme-service refresh">
  <header><h1 id="title">Refresh AI</h1><span id="badge" class="badge" hidden></span></header>
  <main id="main" tabindex="-1"></main>
  <div id="notice" role="status" hidden></div>
  <footer><button id="left"></button><button id="center"></button><button id="right"></button></footer>
</body>
</html>
